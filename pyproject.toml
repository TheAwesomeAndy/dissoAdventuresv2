[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arspinet"
description = "ARSPI-Net: a characterized spiking-reservoir measurement chain for multichannel EEG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew A. Lane" }]
dynamic = ["version"]
# Lower bounds are the versions CI installs. The exact versions that produced the
# committed v2 records are in requirements-lock.txt.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
# v1 chapter scripts, figure generators and validators
legacy = ["pandas>=2.2.3", "matplotlib>=3.9"]
# reading the SCID-5 spreadsheet for experiments/v2/run_v2_depression.py
clinical = ["pandas>=2.2.3", "openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pandas>=2.2.3", "matplotlib>=3.9"]

[tool.setuptools]
packages = ["arspinet_v2"]

[tool.setuptools.dynamic]
version = { attr = "arspinet_v2.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: end-to-end smoke tests that take more than a few seconds",
    "history: needs full git history (skipped in shallow clones)",
]
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
# The v1 dissertation record is outside the linter. It is frozen as defended, and three of
# its files are hashed in the v1 confirmatory record (experiments/records.lock.json).
# All v2 code is linted and formatted; when a frozen v2 file changes, its records are
# regenerated in the same change (AGENTS.md, "Changing frozen code").
extend-exclude = [
    "chapter4Experiments", "chapter5Experiments", "chapter6Experiments", "chapter7Experiments",
    "defense_figures", "validation", "dissertation", "pictures",
    "experiments/chapter3", "experiments/ch5_4class", "experiments/ch6_ch7_3class",
    "experiments/ablation", "experiments/confirmatory", "experiments/external",
    "experiments/interpretability", "experiments/novel",
    "scripts/make_release_manifest.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]   # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
# Experiment scripts put the repository on sys.path before importing from it.
"experiments/**" = ["E402"]
"tests/**" = ["E402"]

[tool.mypy]
files = ["arspinet_v2"]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff.lint.isort]
known-first-party = ["arspinet_v2"]
# Experiment scripts import their siblings by path. Naming them here keeps import order
# the same on every machine: without it, ruff classifies `data` by whether a data/
# directory happens to exist in the checkout.
known-local-folder = ["data", "data_baseline", "run_v2_validation", "run_erpcore"]
